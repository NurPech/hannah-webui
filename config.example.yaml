# Wo der WebUI-Flask-Server selbst lauscht
host: "127.0.0.1"
port: 5000

# Signiert die Flask-Session-Cookie — muss über alle gunicorn-Worker und Neustarts
# hinweg stabil sein, sonst werden Nutzer zufällig ausgeloggt. Generieren mit:
#   python3 -c "import secrets; print(secrets.token_hex(32))"
secret_key: "IHR_SECRET_KEY"

# Telegram Login Widget (Account-Verknüpfung in /me) — Bot-Token via @BotFather,
# Domain muss dort per /setdomain auf diese WebUI-Instanz freigeschaltet sein.
telegram_bot_token: ""
telegram_bot_username: ""

# Microsoft Entra (Account-Verknüpfung in /me, OIDC-Login) — Single-Tenant-App-
# Registration mit Client-Secret, keine API-Permissions nötig. Redirect-URI (Typ
# "Web") dort eintragen: https://<webui-host>/me/entra/callback
entra_client_id: ""
entra_client_secret: ""
entra_tenant: ""    # Tenant-ID (GUID)

# Hannah Core, per gRPC
grpc:
  host: "127.0.0.1"
  port: 50051

# Native TLS-Terminierung (#61) — nötig, damit das Telegram-Login-Widget in /me
# funktioniert (verlangt HTTPS, validiert aber keine CA-Kette; ein selbstsigniertes
# Zertifikat reicht). Bei leerem cert_file/key_file wird beim ersten Start eines
# generiert und dauerhaft unter /var/lib/hannah-webui/tls/ abgelegt (systemd) bzw.
# muss hier für lokale Entwicklung explizit gesetzt werden. Ein Neustart erzeugt
# das Zertifikat nie neu, solange die Datei existiert.
tls:
  enabled: false
  cert_file: ""
  key_file: ""
